apiVersion: apps/v1
kind: Deployment

metadata:
  name: enterprise-green
  namespace: enterprise-devops

spec:

  replicas: 2

  selector:
    matchLabels:
      app: analytics-platform
      version: green

  template:

    metadata:
      labels:
        app: analytics-platform
        version: green

    spec:

      containers:

      - name: analytics-platform

        image: 705557196379.dkr.ecr.us-west-1.amazonaws.com/analytics-platform:v2

        ports:
        - containerPort: 8081